onboarding = false
# herdr 設定 tmux の操作感にそろえる
# 配置先 ~/.config/herdr/config.toml

[keys]
prefix = "ctrl+f"

# ペイン移動 vim 風の hjkl
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# 分割 | で左右 - で上下 claude のペインなら claude が作業している worktree で開く
split_vertical = ""
split_horizontal = ""

# リサイズ方法
# 1. prefix+r を押す
# 2. h を続けて押すと、境界が左に動く
# 3. Esc か Enter で抜ける。時間がたっても自動では抜けない
resize_mode = "prefix+r"

# ワークスペース移動 vim 風の kj (navigate mode 中 矢印上下は使わない)
navigate_workspace_up = "k"
navigate_workspace_down = "j"

# ワークスペース名変更 tmux の prefix+, にそろえる
rename_workspace = "prefix+comma"

# tmux の prefix+n にそろえる 右に分割して claude を起動する
next_tab = ""
[[keys.command]]
key = "prefix+n"
type = "shell"
command = '"$HERDR_BIN_PATH" pane run "$(~/dotfiles/herdr/scripts/split-pane.sh right)" "claude"'

[[keys.command]]
key = "prefix+|"
type = "shell"
command = "~/dotfiles/herdr/scripts/split-pane.sh right"

[[keys.command]]
key = "prefix+minus"
type = "shell"
command = "~/dotfiles/herdr/scripts/split-pane.sh down"

# tmux の prefix+f にそろえる 右に分割して今の会話を fork した claude を起動する
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "~/dotfiles/herdr/scripts/claude-fork.sh"

# tmux の prefix+y にそろえる claude 完了の ntfy 通知を ON と OFF で切り替える
[[keys.command]]
key = "prefix+y"
type = "shell"
command = 'flag=/tmp/claude_ntfy_enabled; if [ -f "$flag" ]; then rm -f "$flag"; herdr notification show "ntfy OFF" --sound none; else : > "$flag"; herdr notification show "ntfy ON" --sound none; fi'

# tmux の prefix+W にあたる 選んだペインを見張り、条件を満たしたら herdr と ntfy に通知する
[[keys.command]]
key = "prefix+m"
type = "popup"
command = "~/dotfiles/herdr/scripts/monitor-pane-notify.sh"
width = "80%"
height = "60%"

[terminal]
# 分割時に元ペインの作業ディレクトリを引き継ぐ
new_cwd = "follow"

[ui]
mouse_capture = true
# スマホで文字を小さくして横に広がっても、サイドバーではなくスマホ用の上の帯で表示する
# PC は手元の herdr から remote でつなぐので、この設定は使われない
mobile_width_threshold = 160
# スマホは指でスクロールするので、スクロールバーの1マスを文字に使う
pane_scrollbars = false
# フォーカス復帰時の全画面再描画を止めてペイン切替の点滅を抑える
redraw_on_focus_gained = false
# ホイール1回のスクロール量を4行にする
mouse_scroll_lines = 4
# 対応が必要な agent を上に並べ、状態を色だけでなく記号の形でも見分ける
agent_panel_sort = "priority"
status_indicators = "symbols"

# claude の行には claude が出しているターミナルタイトルと、prefix+m で見張っているかを足す
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "machine", "workspace", "tab", "$monitor"], ["terminal_title_stripped"], ["agent"]]

# 通知は herdr 画面内トーストで出す (SSH 先の system 通知は手元に届かないため)
[ui.toast]
delivery = "herdr"

# トーストは左下に固定
[ui.toast.herdr]
position = "bottom-left"

[theme]
name = "dracula"
auto_switch = false

