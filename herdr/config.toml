onboarding = false
# herdr 設定 tmux の操作感にそろえる
# 配置先 ~/.config/herdr/config.toml

[keys]
prefix = "ctrl+f"

# ペイン移動 vim 風の hjkl
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# 分割 | で左右 - で上下
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# リサイズ方法
# 1. prefix+r を押す
# 2. h を続けて押すと、境界が左に動く
# 3. Esc か Enter で抜ける。時間がたっても自動では抜けない
resize_mode = "prefix+r"

# ワークスペース移動 vim 風の kj (navigate mode 中 矢印上下は使わない)
navigate_workspace_up = "k"
navigate_workspace_down = "j"

# ワークスペース名変更 tmux の prefix+, にそろえる
rename_workspace = "prefix+comma"

# agent 移動 vim 風の kj (shift 併用 k=前 j=次)
previous_agent = "prefix+shift+k"
next_agent = "prefix+shift+j"

# ワークスペース前後切替 vim 風の HL (agent の kj と対 左右=workspace 上下=agent)
previous_workspace = "prefix+shift+h"
next_workspace = "prefix+shift+l"

# tmux の prefix+n にそろえる 右に分割して claude を起動する
next_tab = ""
[[keys.command]]
key = "prefix+n"
type = "shell"
command = 'herdr pane run "$(herdr pane split "$HERDR_ACTIVE_PANE_ID" --direction right --cwd "$PWD" --focus | jq -r .result.pane.pane_id)" "exec claude"'

# tmux の prefix+f にそろえる 右に分割して今の会話を fork した claude を起動する
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "~/dotfiles/herdr/scripts/claude-fork.sh"

[terminal]
# 分割時に元ペインの作業ディレクトリを引き継ぐ
new_cwd = "follow"

[ui]
mouse_capture = true
# フォーカス復帰時の全画面再描画を止めてペイン切替の点滅を抑える
redraw_on_focus_gained = false
# ホイール1回のスクロール量を4行にする
mouse_scroll_lines = 4
# 対応が必要な agent を上に並べ、状態を色だけでなく記号の形でも見分ける
agent_panel_sort = "priority"
status_indicators = "symbols"

# claude の行には claude が出しているターミナルタイトルを足す
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

# 通知は herdr 画面内トーストで出す (SSH 先の system 通知は手元に届かないため)
[ui.toast]
delivery = "herdr"

# トーストは左下に固定
[ui.toast.herdr]
position = "bottom-left"

[theme]
name = "dracula"
auto_switch = false

