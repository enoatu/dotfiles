services:
  ubuntu:
    build:
      context: ..
      dockerfile: ./docker/ubuntu/Dockerfile
    tty: true
    volumes:
      - ./${USER}-my-box:/mnt
  debian:
    build:
      context: ..
      dockerfile: ./docker/debian/Dockerfile
    tty: true
    volumes:
      - ./${USER}-my-box:/mnt
  bookworm:
    build:
      context: ..
      dockerfile: ./docker/debian/Dockerfile
      args:
        DEBIAN_TAG: bookworm
    tty: true
    volumes:
      - ./${USER}-my-box:/mnt
